name: generic-tutor plugin tests

on:
  push:
    branches: [main]
    paths:
      - "plugin/generic-tutor/**"
      - ".tutor-scripts/**"
      - "pyproject.toml"
      - "tools/**"
      - ".claude-plugin/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/plugin-tests.yml"
  pull_request:
    paths:
      - "plugin/generic-tutor/**"
      - ".tutor-scripts/**"
      - "pyproject.toml"
      - "tools/**"
      - ".claude-plugin/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/plugin-tests.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/generic-tutor
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The plugin's test suite is deliberately stdlib-only (unittest, tempfile,
      # sqlite3) -- no requirements.txt, nothing to install. It never touches a
      # real /EDU/ install: every test builds its own tempdir and runs the
      # scripts under scripts/ directly, so this reproduces exactly what
      # `python3 -m unittest discover tests -v` does on the actual device.
      - name: Run full test suite
        run: python3 -m unittest discover tests -v

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/lint_docs.py --strict
      - name: Command context budget (ratchet)
        run: python3 tools/context_budget.py --check
      - name: CHANGELOG has an entry for the current plugin version
        run: |
          v=$(python3 -c "import json;print(json.load(open('plugin/generic-tutor/.claude-plugin/plugin.json'))['version'])")
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no '## [$v]' entry"; exit 1; }

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin, skills, commands and marketplace manifests
        run: |
          claude plugin validate plugin/generic-tutor --strict
          claude plugin validate plugin/generic-tutor/skills --strict
          claude plugin validate plugin/generic-tutor/commands --strict
          claude plugin validate . --strict
      - name: Plugin zip builds deterministically
        run: |
          python3 tools/build_plugin.py --out /tmp/a.plugin
          python3 tools/build_plugin.py --out /tmp/b.plugin
          cmp /tmp/a.plugin /tmp/b.plugin

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.20 mypy==1.20.2
      - name: ruff (lint only; formatting is not enforced, see pyproject.toml)
        run: ruff check plugin .github
      - name: mypy
        run: mypy plugin/generic-tutor/scripts

  # Longer composition fuzz than the fixed-seed subset in the unit tests. Seeds are the sequence
  # numbers 0..N-1, so any failure is reproduced by `python3 tests/fuzz_lifecycle.py N`.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lifecycle fuzz (1000 sequences x 25 steps)
        working-directory: plugin/generic-tutor
        run: python3 tests/fuzz_lifecycle.py 1000 25

  # The deployed runtime copy must match the plugin source exactly (only the
  # generated .manifest.json is allowed to exist on one side), and its recorded
  # version must match plugin.json.
  deployed-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .tutor-scripts matches plugin/generic-tutor/scripts
        run: diff -r -x .manifest.json -x __pycache__ plugin/generic-tutor/scripts .tutor-scripts
      - name: Manifest version matches plugin.json
        run: |
          python3 - <<'EOF'
          import json
          m = json.load(open(".tutor-scripts/.manifest.json"))["plugin_version"]
          p = json.load(open("plugin/generic-tutor/.claude-plugin/plugin.json"))["version"]
          assert m == p, f"manifest {m} != plugin.json {p}"
          EOF

  # validate-courses moved to edu-courses-private's own CI (30 Sep 2026) --
  # courses/ no longer lives in this repo, see README. .github/scripts/
  # validate_courses.py stays here since it's checked out cross-repo by the
  # private repo's workflow.
