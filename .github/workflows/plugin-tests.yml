name: generic-tutor plugin tests

on:
  push:
    branches: [main]
    paths:
      - "plugin/generic-tutor/**"
      - "courses/**"
      - ".github/workflows/plugin-tests.yml"
      - ".github/scripts/validate_courses.py"
  pull_request:
    paths:
      - "plugin/generic-tutor/**"
      - "courses/**"
      - ".github/workflows/plugin-tests.yml"
      - ".github/scripts/validate_courses.py"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/generic-tutor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The plugin's test suite is deliberately stdlib-only (unittest, tempfile,
      # sqlite3) -- no requirements.txt, nothing to install. It never touches a
      # real /EDU/ install: every test builds its own tempdir and runs the
      # scripts under scripts/ directly, so this reproduces exactly what
      # `python3 -m unittest discover tests -v` does on the actual device.
      - name: Run full test suite
        run: python3 -m unittest discover tests -v

  validate-courses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Structural validation of the real courses/ content, not just the
      # plugin's own tempdir-based unit tests. Runs validate_structure.py and
      # coverage_check.py (both stdlib-only, no deps) against every course
      # under courses/*/ and fails if any course reports a problem -- catches
      # exactly the class of gap that let a courses/-only content change (a
      # 1253-file migration across all 62 courses) ship with zero CI signal
      # before this job existed.
      - name: Validate every course's structure and coverage
        run: python3 .github/scripts/validate_courses.py .
