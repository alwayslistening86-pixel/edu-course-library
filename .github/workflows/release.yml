name: release

on:
  push:
    tags: ["generic-tutor--v*", "v*"]   # `claude plugin tag plugin/generic-tutor --push` creates generic-tutor--v<version>
  workflow_dispatch:                    # run from main; creates the tag server-side
    inputs:
      version:
        description: "Plugin version to release (must equal plugin.json on main), e.g. 1.79.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('generic-tutor--v{0}', inputs.version) || github.ref_name }}
    steps:
      - name: Dispatch only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: echo "dispatch releases only from main"; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Tag matches plugin.json, marketplace.json and CHANGELOG
        run: |
          tag="${TAG##*v}"
          plugin=$(python3 -c "import json;print(json.load(open('plugin/generic-tutor/.claude-plugin/plugin.json'))['version'])")
          [ "$tag" = "$plugin" ] || { echo "tag $tag != plugin.json $plugin"; exit 1; }
          python3 tools/lint_docs.py --strict
          python3 tools/release_notes.py "$tag" > release-notes.md

      - name: Run the test suite
        working-directory: plugin/generic-tutor
        run: python3 -m unittest discover tests

      - name: Build the plugin zip
        run: python3 tools/build_plugin.py --out "dist/generic-tutor-${TAG##*v}.plugin"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "dist/generic-tutor-${TAG##*v}.plugin" \
            --title "generic-tutor ${TAG##*v}" --notes-file release-notes.md --target "$GITHUB_SHA"
