[project]
name = "generic-tutor"
version = "1.12.0"  # mirrors plugin/generic-tutor/.claude-plugin/plugin.json (single source: plugin.json)
description = "Engine scripts for the generic-tutor Claude Cowork plugin"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".tutor-scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
