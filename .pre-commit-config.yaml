repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^\.tutor-scripts/
      - id: check-json
      - id: check-yaml
  - repo: local
    hooks:
      - id: tutor-scripts-sync
        name: .tutor-scripts matches plugin scripts
        entry: diff -r -x .manifest.json -x __pycache__ plugin/generic-tutor/scripts .tutor-scripts
        language: system
        pass_filenames: false
        files: ^(plugin/generic-tutor/scripts|\.tutor-scripts)/
